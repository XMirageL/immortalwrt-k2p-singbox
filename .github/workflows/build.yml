name: Build K2P ImmortalWrt Firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'k2p.config'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  CONFIG_FILE: k2p.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Build Environment
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt update -y
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib gettext \
          git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget upx
        sudo timedatectl set-timezone "$TZ"

    - name: Clone ImmortalWrt Source
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

    - name: Load Feeds & Run DIY-Part1
      run: |
        cd openwrt
        [ -e ../$DIY_P1_SH ] && cp ../$DIY_P1_SH diy-part1.sh && chmod +x diy-part1.sh && ./diy-part1.sh
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply Config & Run DIY-Part2
      run: |
        cd openwrt
        [ -e ../$CONFIG_FILE ] && cp ../$CONFIG_FILE .config
        [ -e ../$DIY_P2_SH ] && cp ../$DIY_P2_SH diy-part2.sh && chmod +x diy-part2.sh && ./diy-part2.sh
        make defconfig

    - name: Download Package Dependencies
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      run: |
        cd openwrt
        echo -e "$(nproc) thread build"
        make -j$(nproc) || make -j1 V=s

    - name: Check Firmware Size
      run: |
        cd openwrt/bin/targets/ramips/mt7621
        ls -lh *sysupgrade.bin
        # 16MB Flash 的实际可用固件大小不可超过约 15.5MB (0xFA0000 空间)

    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: K2P-ImmortalWrt-Firmware
        path: openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin